spring:
  flyway:
    enabled: false

  datasource:
    url: ${DB_URL:?DB_URL missing}
    username: ${DB_USERNAME:?DB_USERNAME missing}
    password: ${DB_PASSWORD:?DB_PASSWORD missing}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret-key: ${JWT_SECRET_KEY:?JWT_SECRET_KEY missing}
    access-expiration: 900000
    refresh-expiration: 2592000000
    signup-expiration: 900000

  oauth2:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID missing}

  data:
    redis:
      host: ${REDIS_URL:?REDIS_URL missing}
      port: ${REDIS_PORT:?REDIS_HOST missing}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:?FIREBASE_SERVICE_ACCOUNT_JSON missing}
